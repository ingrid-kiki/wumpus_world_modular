# Configuração das ferramentas de desenvolvimento.
# O empacotamento do projeto ([project]) entra na Fase 5 (v2.0.0).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Nenhum teste pode travar a suíte (o agente lógico entra em loop infinito, ver #17).
timeout = 60
# xfail que passa a passar indica bug corrigido: falha para lembrar de tirar a marcação.
xfail_strict = true
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["pygad"]

[tool.ruff.lint]
# Erros reais (F, E9), imports (I), espaços (W), sintaxe antiga (UP), armadilhas (B), simplificações (SIM),
# complexidade (C90) e nomes sem acento (PLC2401, PLC2403; textos usados como nome: tests/test_nomes_sem_acento.py).
select = ["E9", "F", "I", "W", "UP", "B", "SIM", "C90", "PLC2401", "PLC2403"]

[tool.ruff.lint.mccabe]
# Funções acima do limite só com "# noqa: C901" e justificativa; tests/test_tamanho_das_funcoes.py confere onde.
max-complexity = 10

[tool.coverage.run]
# sysmon usa o mecanismo de monitoramento do Python 3.12+
core = "sysmon"
source = ["."]
omit = ["tests/*", "pygad/*", ".venv/*", "logs/*"]

[tool.coverage.report]
# Mínimo igual ao medido na Etapa 1 (79%), com 1 ponto de folga para diferenças entre Windows e Linux
fail_under = 78

[tool.mypy]
# Checagem dos tipos (Etapa 3, PR H). Os testes ficam de fora; tests/test_tipos.py exige tipos nas funções públicas.
python_version = "3.12"
files = ["main.py", "benchmark.py", "reproduzir.py", "agents", "ga", "world", "utils", "visual", "experimentos"]
# Bibliotecas sem tipos publicados (seaborn, joblib, scikit-learn...) são tratadas como Any
ignore_missing_imports = true
# Uma função com tipos precisa tê-los em todos os parâmetros e no retorno
disallow_incomplete_defs = true
# Confere também o corpo das funções que ainda não têm tipos
check_untyped_defs = true
